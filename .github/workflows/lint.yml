# Lints the workflows and shell scripts and tests the actions, on every pull request and push to main.
name: Lint and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: actionlint (also runs shellcheck on run blocks)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: shellcheck
        run: shellcheck -x lib/*.sh actions/*/*.sh tests/*/*.sh
      - name: Plugin manifests are valid JSON
        run: jq empty .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json

  test-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run every tests/*/test-*.sh
        run: |
          status=0
          for test in tests/*/test-*.sh; do
            echo "::group::$test"
            bash "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # The error annotations this job shows are expected.
  test-without-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: add-to-board with no token
        id: board
        uses: ./actions/add-to-board
        with:
          board-token: ''
          owner: someone
          project-number: 1
          defaults: Status=Backlog
          sprint-tz: UTC
      - name: board-sweep with no token
        id: sweep
        continue-on-error: true
        uses: ./actions/board-sweep
        with:
          board-token: ''
          owner: someone
          project-number: 1
          defaults: Status=Backlog
          sprint-tz: UTC
          sprint-fill-days: 3
          sprint-length-days: 14
      - name: sprint-rollover with no token
        id: rollover
        continue-on-error: true
        uses: ./actions/sprint-rollover
        with:
          board-token: ''
          owner: someone
          project-number: 1
          sprint-tz: UTC
      - name: Check that add-to-board skipped and the others failed
        env:
          ITEM_ID: ${{ steps.board.outputs.item-id }}
          SWEEP: ${{ steps.sweep.outcome }}
          ROLLOVER: ${{ steps.rollover.outcome }}
        run: |
          if [[ -n "$ITEM_ID" || "$SWEEP" != failure || "$ROLLOVER" != failure ]]; then
            echo "::error::Expected a skip and two failures, got item '$ITEM_ID', board-sweep $SWEEP, sprint-rollover $ROLLOVER"
            exit 1
          fi
          echo "add-to-board skipped; board-sweep and sprint-rollover failed as expected"
