# Lints the workflows and shell scripts in this repo and tests the actions.
# Runs on every pull request and on pushes to main.
name: Lint and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: actionlint (also runs shellcheck on run blocks)
        # SC2016 is ignored because the $names inside single-quoted GraphQL queries
        # are GraphQL variables. add-to-board.yml has to stay an unchanged copy, so
        # it can't carry a shellcheck directive.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -ignore 'SC2016:'
      - name: shellcheck
        # -x follows the `source` lines into lib/ and tests/lib/.
        run: shellcheck -x lib/*.sh actions/*/*.sh tests/*/*.sh

  test-set-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run set-fields.sh against a fake gh
        run: bash tests/add-to-board/test-set-fields.sh

  test-skip-without-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run the action with no token
        id: board
        uses: ./actions/add-to-board
        with:
          board-token: ''
      - name: Check that it skipped
        env:
          ITEM_ID: ${{ steps.board.outputs.item-id }}
        run: |
          if [[ -n "$ITEM_ID" ]]; then
            echo "::error::Expected no item ID without a token, got '$ITEM_ID'"
            exit 1
          fi
          echo "Skipped as expected"

  test-board-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run the board-sweep scripts against a fake gh
        run: bash tests/board-sweep/test-board-sweep.sh

  test-sprint-rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run rollover.sh against a fake gh
        run: bash tests/sprint-rollover/test-sprint-rollover.sh

  # Unlike add-to-board, the scheduled actions fail without a token, so a
  # missing secret gets noticed. The error annotations this job shows are expected.
  test-scheduled-need-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run board-sweep with no token
        id: sweep
        continue-on-error: true
        uses: ./actions/board-sweep
        with:
          board-token: ''
      - name: Run sprint-rollover with no token
        id: rollover
        continue-on-error: true
        uses: ./actions/sprint-rollover
        with:
          board-token: ''
      - name: Check that both failed
        env:
          SWEEP: ${{ steps.sweep.outcome }}
          ROLLOVER: ${{ steps.rollover.outcome }}
        run: |
          if [[ "$SWEEP" != failure || "$ROLLOVER" != failure ]]; then
            echo "::error::Expected both to fail without a token, got board-sweep: $SWEEP, sprint-rollover: $ROLLOVER"
            exit 1
          fi
          echo "Both failed as expected"
