name: Sprint rollover
description: >-
  Run at the start of each sprint. Moves Todo cards from the current or an earlier sprint,
  and Backlog cards from the current sprint, to Backlog in the next sprint.

inputs:
  board-token:
    description: Classic personal access token with the `repo` and `project` scopes, usually `secrets.BOARD_TOKEN`.
    required: true
  owner:
    description: Login of the user that owns the project board.
    required: true
  project-number:
    description: Number of the project board, from its URL (`/users/<owner>/projects/<number>`).
    required: true
  sprint-tz:
    description: Timezone for "today" when finding the sprint that is starting.
    required: true
  as-of:
    description: Act as if today is this date (YYYY-MM-DD). Empty for today.
    required: false
  dry-run:
    description: "`true` to only list the cards that would move. Anything else moves them."
    required: false

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        BOARD_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        SPRINT_TZ: ${{ inputs.sprint-tz }}
      run: bash "$GITHUB_ACTION_PATH/../../lib/require-inputs.sh" BOARD_TOKEN OWNER PROJECT_NUMBER SPRINT_TZ

    # A scheduled run only acts on the day a sprint starts, because cron can't count fortnights.
    - name: Roll Todo and Backlog cards to the next sprint
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        SPRINT_TZ: ${{ inputs.sprint-tz }}
        AS_OF: ${{ inputs.as-of }}
        DRY_RUN: ${{ inputs.dry-run }}
        ONLY_ON_SPRINT_START: ${{ github.event_name == 'schedule' }}
      run: bash "$GITHUB_ACTION_PATH/rollover.sh"
