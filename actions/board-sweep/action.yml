name: Board sweep
description: >-
  Scheduled safety net for a GitHub Projects board: adds missing issues, fills empty
  fields and recent Sprints, checks sprints are left, and reopens issues moved out of Done.

inputs:
  board-token:
    description: Classic personal access token with the `repo` and `project` scopes, usually `secrets.BOARD_TOKEN`.
    required: true
  owner:
    description: Login of the user that owns the project board and the repos to sweep.
    required: true
  project-number:
    description: Number of the project board, from its URL (`/users/<owner>/projects/<number>`).
    required: true
  skip-repos:
    description: Space-separated names of the owner's repos whose issues stay off the board. Empty for none.
    required: false
  defaults:
    description: Space-separated `Field=Option` pairs for single-select fields. Only empty fields are filled.
    required: true
  sprint-tz:
    description: Timezone for "today". The next sprint is the first Sprint iteration that starts after today.
    required: true
  sprint-fill-days:
    description: Only cards added in the last this many days, and not Done, get the next sprint.
    required: true
  sprint-length-days:
    description: Expected sprint length in days. Upcoming sprints of another length get a warning.
    required: true

runs:
  using: composite
  steps:
    - name: Check inputs
      id: check
      shell: bash
      env:
        BOARD_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        DEFAULTS: ${{ inputs.defaults }}
        SPRINT_TZ: ${{ inputs.sprint-tz }}
        SPRINT_FILL_DAYS: ${{ inputs.sprint-fill-days }}
        SPRINT_LENGTH_DAYS: ${{ inputs.sprint-length-days }}
      run: >-
        bash "$GITHUB_ACTION_PATH/../../lib/require-inputs.sh"
        BOARD_TOKEN OWNER PROJECT_NUMBER DEFAULTS SPRINT_TZ SPRINT_FILL_DAYS SPRINT_LENGTH_DAYS

    - name: Add missing issues to the board
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        SKIP_REPOS: ${{ inputs.skip-repos }}
      run: bash "$GITHUB_ACTION_PATH/add-missing.sh"

    - name: Fill empty Priority, Size, Status and Sprint
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        DEFAULTS: ${{ inputs.defaults }}
        SPRINT_TZ: ${{ inputs.sprint-tz }}
        SPRINT_FILL_DAYS: ${{ inputs.sprint-fill-days }}
        SPRINT_LENGTH_DAYS: ${{ inputs.sprint-length-days }}
      run: bash "$GITHUB_ACTION_PATH/fill-defaults.sh"

    # Runs even when filling failed (for example because no sprint is left).
    - name: Reopen issues moved out of Done
      if: ${{ !cancelled() && steps.check.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.board-token }}
        OWNER: ${{ inputs.owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
      run: bash "$GITHUB_ACTION_PATH/reopen-moved.sh"
